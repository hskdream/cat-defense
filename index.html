<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a12">
<title>猫猫防线 · 肉鸽塔防</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#10160b;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#24361a,#0b0f07 75%)}
#game{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(8,12,5,.62);backdrop-filter:blur(3px);animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{position:relative;width:min(88%,900px);padding:26px 30px 30px;border-radius:26px;
  background:linear-gradient(180deg,#f7e6b8,#e8cd8c 55%,#d8b46b);
  border:6px solid #5e3d1c;box-shadow:0 0 0 4px #a97b3e,0 18px 50px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.6)}
.panel h2{margin:0 0 4px;font-size:30px;color:#4a2c0e;letter-spacing:2px;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.45)}
.panel .sub{text-align:center;color:#7a5124;font-size:15px;margin-bottom:18px}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.card{width:230px;min-height:210px;border-radius:18px;background:linear-gradient(180deg,#fffdf3,#f3e4bd);
  border:4px solid #7d5525;padding:16px 14px 14px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 6px 0 #6b471f,0 10px 18px rgba(0,0,0,.25);transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #6b471f}
.card .tag{position:absolute;top:0;left:0;right:0;height:8px;background:#7bbf5a}
.card.rare .tag{background:#4a90d9}
.card.epic .tag{background:#b06ad6}
.card .name{font-size:21px;font-weight:700;color:#3f2a10;margin:8px 0 10px;text-align:center}
.card .desc{font-size:15px;line-height:1.6;color:#5c4526;text-align:center}
.card .rarity{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#8a6a3a;letter-spacing:2px}
.card:hover{transform:translateY(-3px)}
.result{margin:6px 0 14px;display:flex;justify-content:center;gap:36px;text-align:center}
.result .num{font-size:44px;font-weight:800;color:#4a2c0e;line-height:1.1}
.result .lb{font-size:14px;color:#7a5124;letter-spacing:1px}
.rating{font-size:84px;font-weight:900;text-align:center;line-height:1;margin:2px 0 6px;
  color:#e8a520;text-shadow:0 4px 0 #8a5a10,0 0 26px rgba(255,200,60,.55)}
.btn{display:block;margin:8px auto 0;padding:14px 46px;border:none;border-radius:16px;cursor:pointer;
  font-size:21px;font-weight:800;letter-spacing:3px;color:#fff8e6;font-family:inherit;
  background:linear-gradient(180deg,#8fca5a,#5e9c35);border-bottom:5px solid #3f6d22;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
#rotate{display:none;position:absolute;inset:0;background:#10160b;color:#f3e4bd;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:22px;z-index:9}
#rotate .rot-icon{font-size:60px;animation:spin 2.2s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
@media (max-width:700px){
  .panel{width:94%;padding:18px 16px 22px;border-radius:20px}
  .panel h2{font-size:24px}.panel .sub{font-size:13px;margin-bottom:12px}
  .card{width:30%;min-width:150px;min-height:170px;padding:12px 10px}
  .card .name{font-size:17px}.card .desc{font-size:12.5px}.card .rarity{font-size:10px}
  .result{gap:22px}.result .num{font-size:34px}.rating{font-size:64px}
  .btn{font-size:18px;padding:12px 36px}
}

</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="rotate">
    <div class="rot-icon">⟳</div>
    <div>请把手机横过来</div>
  </div>
</div>

<script>
/* 猫猫防线 · 肉鸽塔防 —— 单文件原生 JS + Canvas，无任何外部依赖 */
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;

  // ---------- 网格与配置 ----------
  const GRID = { x: 176, y: 116, cw: 110, ch: 104, cols: 9, rows: 5 };
  GRID.w = GRID.cw * GRID.cols;
  GRID.h = GRID.ch * GRID.rows;

  const CFG = {
    startSun: 250,
    plantCost: 75,
    plantHp: 100,
    plantAtk: 25,
    plantInterval: 1.0,
    zombieHp: 100,
    zombieAtk: 45,
    zombieBite: 1.5,
    zombieSpeed: 24,
    projSpeed: 560,
    sunValue: 25,
    sunEvery: 3.0,
    cardCd: 2.4,
    mowerSpeed: 900
  };

  const BUFFS = [
    { id: 'rate', name: '疾风之爪', desc: '猫猫攻击速度 +18%', rarity: 'common', w: 1,
      apply: m => { m.rateStacks = (m.rateStacks || 0) + 1; m.rate = 1 / (1 + 0.18 * m.rateStacks); } },
    { id: 'dmg', name: '利爪打磨', desc: '猫耳伤害 +25%', rarity: 'common', w: 1,
      apply: m => { m.dmgStacks = (m.dmgStacks || 0) + 1; m.dmg = 1 + 0.25 * m.dmgStacks; } },
    { id: 'cost', name: '阳光精算', desc: '种植消耗 -12%（最低 30）', rarity: 'common', w: 1,
      apply: m => { m.costStacks = (m.costStacks || 0) + 1; m.cost = Math.max(0.4, Math.pow(0.88, m.costStacks)); } },
    { id: 'hp', name: '厚皮', desc: '猫猫血量 +30%，并立刻回满', rarity: 'common', w: 0.9,
      apply: m => { m.hpStacks = (m.hpStacks || 0) + 1; m.hp = 1 + 0.3 * m.hpStacks; } },
    { id: 'sun', name: '阳光丰收', desc: '所有阳光收益 +20%', rarity: 'common', w: 0.9,
      apply: m => { m.sunStacks = (m.sunStacks || 0) + 1; m.sun = 1 + 0.2 * m.sunStacks; } },
    { id: 'kill', name: '击杀回响', desc: '每击杀一只怪物 +3 阳光', rarity: 'common', w: 0.9,
      apply: m => { m.killSun += 3; } },
    { id: 'pierce', name: '穿透猫耳', desc: '猫耳可以多穿透 1 个敌人', rarity: 'rare', w: 0.45,
      apply: m => { m.pierce += 1; } },
    { id: 'slow', name: '冰霜猫耳', desc: '命中后减速 35%，持续 1.5 秒', rarity: 'rare', w: 0.4,
      apply: m => { m.slow = 1; } }
  ];

  const RARITY_NAME = { common: '普通', rare: '稀有', epic: '传说' };

  // ---------- 资源 ----------
  const IMG = {};
  let assetsReady = false;
  function loadAssets(cb) {
    const keys = Object.keys(window.ASSETS || {});
    if (!keys.length) { assetsReady = true; cb(); return; }
    let n = 0;
    const done = () => { if (++n >= keys.length) { assetsReady = true; cb(); } };
    keys.forEach(k => {
      const im = new Image();
      im.onload = done;
      im.onerror = done;
      im.src = window.ASSETS[k];
      IMG[k] = im;
    });
  }

  // ---------- 音效（极简合成器） ----------
  let AC = null;
  function ensureAudio() {
    if (AC) return;
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const SFX = {
    shoot: () => tone(760, 0.07, 'square', 0.03, 420),
    plant: () => tone(320, 0.12, 'sine', 0.09, 480),
    hit: () => tone(220, 0.05, 'square', 0.025, 160),
    sun: () => tone(880, 0.12, 'sine', 0.06, 1320),
    mower: () => tone(120, 0.45, 'sawtooth', 0.07, 60),
    lose: () => tone(300, 0.8, 'sawtooth', 0.1, 60),
    buff: () => { tone(520, 0.12, 'triangle', 0.07, 780); setTimeout(() => tone(780, 0.16, 'triangle', 0.06, 1040), 110); }
  };

  // ---------- 状态 ----------
  let S = null;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function cellCenter(col, row) {
    return {
      x: GRID.x + col * GRID.cw + GRID.cw / 2,
      y: GRID.y + row * GRID.ch + GRID.ch / 2
    };
  }
  function cellAt(x, y) {
    if (x < GRID.x || x > GRID.x + GRID.w || y < GRID.y || y > GRID.y + GRID.h) return null;
    return {
      col: Math.floor((x - GRID.x) / GRID.cw),
      row: Math.floor((y - GRID.y) / GRID.ch)
    };
  }

  function plantCost() {
    return Math.max(30, Math.round(CFG.plantCost * S.mods.cost / 5) * 5);
  }

  function newRun() {
    buffRects = [];
    againRect = null;
    S = {
      sun: CFG.startSun,
      wave: 0,
      phase: 'prep',
      prepT: 2.6,
      t: 0,
      clearT: 0,
      plants: [], zombies: [], shots: [], suns: [], parts: [], texts: [], mowers: [],
      queue: [], spawnT: 0, waveTotal: 0, waveSpawned: 0,
      sunT: 2.5,
      cardCd: 0,
      selected: false,
      hover: null,
      kills: 0,
      buffs: [],
      mods: { dmg: 1, rate: 1, cost: 1, hp: 1, sun: 1, killSun: 6, pierce: 0, slow: 0 },
      banner: null,
      buffOpen: false,
      buffOptions: [],
      over: false,
      best: parseInt(localStorage.getItem('cat_td_best') || '0', 10) || 0,
      tipT: 22
    };
    for (let r = 0; r < GRID.rows; r++) {
      S.mowers.push({ row: r, x: 92, used: false, rolling: false, rot: 0 });
    }
  }

  // ---------- 波次 ----------
  function startWave(n) {
    S.wave = n;
    S.phase = 'wave';
    S.clearT = 0;
    S.waveSpawned = 0;
    const count = 3 + Math.floor(n * 1.5);
    S.waveTotal = count;
    S.queue = [];
    const interval = Math.max(1.0, 3.0 - n * 0.15);
    let t = 0.4;
    for (let i = 0; i < count; i++) {
      S.queue.push({ at: t, row: Math.floor(Math.random() * GRID.rows) });
      t += interval * rand(0.75, 1.25);
    }
    S.spawnT = 0;
    S.banner = { text: '第 ' + n + ' 波', life: 1.8, max: 1.8 };
    showTip(false);
  }

  function spawnZombie(row) {
    const n = S.wave;
    const hpMul = (1 + 0.16 * (n - 1)) * Math.pow(1.035, n) * (n % 5 === 0 ? 1.12 : 1);
    const hp = Math.round(CFG.zombieHp * hpMul);
    S.zombies.push({
      row,
      x: 1292 + rand(0, 70),
      hp, maxHp: hp,
      speed: Math.min(56, CFG.zombieSpeed + n * 0.8),
      eatT: 0,
      eating: false,
      flash: 0,
      slowT: 0,
      bob: rand(0, 6.28)
    });
  }

  // ---------- Buff ----------
  function openBuff() {
    S.phase = 'buff';
    S.buffOpen = true;
    const rareAllowed = S.wave >= 2;
    const pool = BUFFS.filter(b => b.rarity === 'common' || rareAllowed);
    const opts = [];
    const bag = pool.slice();
    while (opts.length < 3 && bag.length) {
      const total = bag.reduce((a, b) => a + b.w, 0);
      let r = Math.random() * total, idx = 0;
      for (let i = 0; i < bag.length; i++) { r -= bag[i].w; if (r <= 0) { idx = i; break; } }
      opts.push(bag.splice(idx, 1)[0]);
    }
    S.buffOptions = opts;
  }

  function chooseBuff(b) {
    b.apply(S.mods);
    S.buffs.push(b.id);
    if (b.id === 'hp') {
      S.plants.forEach(p => { p.maxHp = Math.round(CFG.plantHp * S.mods.hp); p.hp = p.maxHp; });
    }
    S.buffOpen = false;
    SFX.buff();
    S.phase = 'prep';
    S.prepT = 1.9;
    S.banner = { text: '第 ' + (S.wave + 1) + ' 波', life: 1.6, max: 1.6 };
  }

  // ---------- 覆盖层（Canvas 内绘制，手机与桌面表现一致） ----------
  let buffRects = [];
  let againRect = null;

  const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
  const font = (w, px) => w + ' ' + px + 'px ' + FONT;

  function wrapLines(text, maxW, f) {
    ctx.font = f;
    const lines = [];
    let cur = '';
    for (const ch of text) {
      if (cur && ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawPanel(x, y, w, h, r) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#8d6537');
    g.addColorStop(1, '#64421f');
    roundRect(x, y, w, h, r);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#42290f';
    ctx.stroke();

    const ix = x + 10, iy = y + 10, iw = w - 20, ih = h - 20;
    const g2 = ctx.createLinearGradient(0, iy, 0, iy + ih);
    g2.addColorStop(0, '#fffaea');
    g2.addColorStop(1, '#efd79b');
    roundRect(ix, iy, iw, ih, Math.max(6, r - 8));
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.stroke();
  }

  function pawIcon(cx, cy, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.3, r * 0.5, r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const toes = [[-0.62, -0.34, 0.24], [-0.22, -0.62, 0.26], [0.22, -0.62, 0.26], [0.62, -0.34, 0.24]];
    for (const [dx, dy, rr] of toes) {
      ctx.beginPath();
      ctx.arc(cx + dx * r, cy + dy * r, rr * r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBuffPanel() {
    ctx.fillStyle = 'rgba(10,14,6,.62)';
    ctx.fillRect(0, 0, W, H);

    const pw = 900, ph = 468, px = (W - pw) / 2, py = 118;
    drawPanel(px, py, pw, ph, 28);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4a2c0e';
    ctx.font = font(800, 36);
    ctx.fillText('第 ' + S.wave + ' 波 · 清空', W / 2, py + 64);
    ctx.font = font(600, 18);
    ctx.fillStyle = '#8a6637';
    ctx.fillText('选择一项强化，迎接下一波', W / 2, py + 106);

    const cw = 252, chh = 236, gap = 24;
    const sx = (W - (cw * 3 + gap * 2)) / 2, sy = py + 140;
    buffRects = [];
    S.buffOptions.forEach((b, i) => {
      const x = sx + i * (cw + gap);
      const g = ctx.createLinearGradient(0, sy, 0, sy + chh);
      g.addColorStop(0, '#fffdf4');
      g.addColorStop(1, '#f1dfb3');
      roundRect(x, sy, cw, chh, 18);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#7d5525';
      ctx.stroke();

      const col = b.rarity === 'rare' ? '#4a90d9' : b.rarity === 'epic' ? '#b06ad6' : '#7bbf5a';
      ctx.save();
      roundRect(x + 5, sy + 5, cw - 10, 10, 5);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.restore();

      // 图标底盘 + 爪印
      ctx.beginPath();
      ctx.arc(x + cw / 2, sy + 62, 34, 0, Math.PI * 2);
      ctx.fillStyle = b.rarity === 'rare' ? 'rgba(74,144,217,.16)' : b.rarity === 'epic' ? 'rgba(176,106,214,.16)' : 'rgba(123,191,90,.18)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(125,85,37,.35)';
      ctx.stroke();
      pawIcon(x + cw / 2, sy + 60, 19, col);

      ctx.fillStyle = '#3f2a10';
      ctx.font = font(800, 24);
      ctx.fillText(b.name, x + cw / 2, sy + 122);

      const df = font(600, 15);
      const lines = wrapLines(b.desc, cw - 46, df);
      ctx.font = df;
      ctx.fillStyle = '#5c4526';
      lines.forEach((ln, k) => ctx.fillText(ln, x + cw / 2, sy + 156 + k * 24));

      ctx.font = font(700, 13);
      ctx.fillStyle = '#8a6a3a';
      ctx.fillText('◆ ' + (RARITY_NAME[b.rarity] || ''), x + cw / 2, sy + chh - 22);

      buffRects.push({ x, y: sy, w: cw, h: chh });
    });
  }

  function drawOverPanel() {
    ctx.fillStyle = 'rgba(10,14,6,.66)';
    ctx.fillRect(0, 0, W, H);

    const pw = 660, ph = 456, px = (W - pw) / 2, py = 132;
    drawPanel(px, py, pw, ph, 28);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#4a2c0e';
    ctx.font = font(800, 38);
    ctx.fillText('防线失守', W / 2, py + 66);

    const r = ratingOf(S.wave);
    const rcol = r === 'S' ? '#f0a81e' : r === 'A' ? '#4a90d9' : r === 'B' ? '#5e9c35' : '#b8894a';
    ctx.save();
    ctx.font = font(900, 108);
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(74,44,14,.35)';
    ctx.strokeText(r, W / 2, py + 176);
    ctx.fillStyle = rcol;
    ctx.fillText(r, W / 2, py + 176);
    ctx.restore();

    const stats = [
      [String(S.wave), '坚持波次'],
      [String(S.kills), '击杀'],
      [String(S.best), '最高纪录']
    ];
    stats.forEach((st, i) => {
      const cx = W / 2 + (i - 1) * 190;
      ctx.fillStyle = '#4a2c0e';
      ctx.font = font(800, 42);
      ctx.fillText(st[0], cx, py + 272);
      ctx.fillStyle = '#8a6637';
      ctx.font = font(600, 15);
      ctx.fillText(st[1], cx, py + 306);
    });

    const bw = 300, bh = 66, bx = W / 2 - bw / 2, by = py + ph - 92;
    const g = ctx.createLinearGradient(0, by, 0, by + bh);
    g.addColorStop(0, '#96d160');
    g.addColorStop(1, '#5a9a32');
    roundRect(bx, by, bw, bh, 18);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#39631c';
    ctx.stroke();
    ctx.fillStyle = '#fffbe9';
    ctx.font = font(800, 24);
    ctx.fillText('再来一局', W / 2, by + bh / 2 + 1);
    againRect = { x: bx, y: by, w: bw, h: bh };
  }

  function hitRect(r, x, y) {
    return !!r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function ratingOf(w) {
    if (w >= 15) return 'S';
    if (w >= 11) return 'A';
    if (w >= 7) return 'B';
    return 'C';
  }

  function gameOver() {
    if (S.over) return;
    S.over = true;
    S.phase = 'over';
    S.buffOpen = false;
    SFX.lose();
    if (S.wave > S.best) {
      S.best = S.wave;
      try { localStorage.setItem('cat_td_best', String(S.best)); } catch (e) {}
    }
  }

  // ---------- 逻辑更新 ----------
  function addSun(x, y, value, ty) {
    S.suns.push({ x, y, ty: ty || rand(300, 600), value, vy: 70, life: 11, bob: rand(0, 6.28) });
  }

  function collectSun(s) {
    const v = Math.round(s.value * S.mods.sun);
    S.sun += v;
    S.texts.push({ x: s.x, y: s.y - 10, text: '+' + v, life: 0.9, max: 0.9, color: '#ffe066' });
    S.parts.push({ x: s.x, y: s.y, vx: 0, vy: -80, life: 0.4, max: 0.4, color: '#ffe066', size: 5 });
    SFX.sun();
  }

  function burst(x, y, color, n, spd) {
    for (let i = 0; i < (n || 8); i++) {
      const a = rand(0, Math.PI * 2), v = rand(40, spd || 170);
      S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: rand(0.3, 0.7), max: 0.7, color, size: rand(2, 5) });
    }
  }

  function update(dt) {
    S.t += dt;
    if (S.tipT > 0) S.tipT -= dt;
    if (S.banner) { S.banner.life -= dt; if (S.banner.life <= 0) S.banner = null; }
    if (S.cardCd > 0) S.cardCd -= dt;

    // 粒子/飘字
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.life -= dt;
      if (p.life <= 0) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
    }
    for (let i = S.texts.length - 1; i >= 0; i--) {
      const t = S.texts[i]; t.life -= dt; t.y -= 42 * dt;
      if (t.life <= 0) S.texts.splice(i, 1);
    }

    if (S.phase === 'over') return;

    // 天降阳光
    S.sunT -= dt;
    if (S.sunT <= 0) {
      S.sunT = CFG.sunEvery * rand(0.85, 1.15);
      const x = rand(GRID.x + 40, GRID.x + GRID.w - 40);
      S.suns.push({ x, y: -40, ty: rand(GRID.y + 70, GRID.y + GRID.h - 50), value: CFG.sunValue, vy: 120, life: 13, bob: rand(0, 6.28) });
    }
    for (let i = S.suns.length - 1; i >= 0; i--) {
      const s = S.suns[i];
      if (s.y < s.ty) s.y = Math.min(s.ty, s.y + s.vy * dt);
      s.life -= dt;
      if (s.life <= 0) S.suns.splice(i, 1);
    }

    // 波次推进
    if (S.phase === 'prep') {
      S.prepT -= dt;
      if (S.prepT <= 0) startWave(S.wave + 1);
    } else if (S.phase === 'wave') {
      S.spawnT += dt;
      while (S.queue.length && S.queue[0].at <= S.spawnT) {
        spawnZombie(S.queue.shift().row);
        S.waveSpawned++;
      }
      if (!S.queue.length && !S.zombies.length) {
        S.clearT += dt;
        if (S.clearT > 0.7) openBuff();
      } else S.clearT = 0;
    }

    // 猫猫攻击
    for (const p of S.plants) {
      p.flash = Math.max(0, p.flash - dt);
      p.bob += dt;
      p.cd -= dt;
      let target = null;
      for (const z of S.zombies) {
        if (z.row !== p.row || z.hp <= 0) continue;
        if (z.x > p.x - 10) { if (!target || z.x < target.x) target = z; }
      }
      if (target && p.cd <= 0) {
        p.cd = CFG.plantInterval * S.mods.rate;
        const cy = cellCenter(p.col, p.row).y;
        S.shots.push({ row: p.row, x: p.x + 34, y: cy - 10, dmg: CFG.plantAtk * S.mods.dmg, pierce: S.mods.pierce, slow: S.mods.slow, rot: 0 });
        SFX.shoot();
        p.flash = 0.12;
      }
    }

    // 子弹
    for (let i = S.shots.length - 1; i >= 0; i--) {
      const sh = S.shots[i];
      sh.x += CFG.projSpeed * dt;
      sh.rot += dt * 10;
      if (sh.x > 1300) { S.shots.splice(i, 1); continue; }
      for (const z of S.zombies) {
        if (z.row !== sh.row || z.hp <= 0) continue;
        if (sh.x >= z.x - 26 && sh.x <= z.x + 28) {
          z.hp -= sh.dmg;
          z.flash = 0.12;
          if (sh.slow) { z.slowT = 1.5; }
          burst(sh.x, sh.y, '#ffd9e6', 5, 120);
          SFX.hit();
          if (z.hp <= 0) {
            z.dead = true;
            S.kills++;
            if (S.mods.killSun) { S.sun += S.mods.killSun; S.texts.push({ x: z.x, y: cellCenter(0, z.row).y - 40, text: '+' + S.mods.killSun, life: 0.8, max: 0.8, color: '#ffe066' }); }
            burst(z.x, cellCenter(0, z.row).y, '#ffffff', 10, 200);
          }
          if (sh.pierce > 0) { sh.pierce--; } else { S.shots.splice(i, 1); }
          break;
        }
      }
    }
    S.zombies = S.zombies.filter(z => !z.dead);

    // 僵尸
    for (const z of S.zombies) {
      z.flash = Math.max(0, z.flash - dt);
      if (z.slowT > 0) z.slowT -= dt;
      const cy = cellCenter(0, z.row).y;
      // 找可啃的猫
      let target = null;
      for (const p of S.plants) {
        if (p.row !== z.row) continue;
        if (z.x - 24 <= p.x + 24 && z.x > p.x - 8) { if (!target || p.x > target.x) target = p; }
      }
      if (target) {
        z.eating = true;
        z.eatT -= dt;
        if (z.eatT <= 0) {
          z.eatT = CFG.zombieBite;
          target.hp -= CFG.zombieAtk;
          target.flash = 0.15;
          SFX.hit();
          S.texts.push({ x: target.x, y: cy - 30, text: '-' + CFG.zombieAtk, life: 0.6, max: 0.6, color: '#ff6b6b' });
          if (target.hp <= 0) {
            S.plants = S.plants.filter(p => p !== target);
            burst(target.x, cy, '#c7e59a', 12, 180);
          }
        }
      } else {
        z.eating = false;
        z.eatT = 0;
        const sp = z.speed * (z.slowT > 0 ? 0.65 : 1);
        z.x -= sp * dt;
      }

      // 小推车触发
      if (z.x < 150) {
        const m = S.mowers.find(m => m.row === z.row && !m.used);
        if (m) { m.used = true; m.rolling = true; SFX.mower(); }
      }
      // 突破防线
      if (z.x < 58) { gameOver(); return; }
    }

    // 小推车
    for (const m of S.mowers) {
      if (!m.rolling) continue;
      m.rot += dt * 16;
      m.x += CFG.mowerSpeed * dt;
      for (const z of S.zombies) {
        if (z.row !== m.row || z.dead) continue;
        if (Math.abs(z.x - m.x) < 62) {
          z.dead = true;
          S.kills++;
          burst(z.x, cellCenter(0, z.row).y, '#ffd166', 10, 220);
        }
      }
      if (m.x > 1310) m.rolling = false;
    }
    S.zombies = S.zombies.filter(z => !z.dead);
  }

  // ---------- 绘制 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function cloud(x, y, k) {
    ctx.save();
    ctx.globalAlpha = 0.75 * k;
    ctx.fillStyle = '#ffffff';
    const blobs = [[0, 0, 30], [30, -8, 24], [-32, 4, 20], [58, 6, 16], [-58, 10, 14]];
    for (const [dx, dy, r] of blobs) {
      ctx.beginPath(); ctx.arc(x + dx * k, y + dy * k, r * k, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawLawn() {
    // 草坪底色
    const g = ctx.createLinearGradient(0, GRID.y, 0, GRID.y + GRID.h);
    g.addColorStop(0, '#8cc44f');
    g.addColorStop(1, '#71a83c');
    ctx.fillStyle = g;
    ctx.fillRect(GRID.x, GRID.y, GRID.w, GRID.h);

    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        // 棋盘格草地，贴近原版手感
        ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,.055)' : 'rgba(24,48,8,.055)';
        ctx.fillRect(GRID.x + c * GRID.cw, GRID.y + r * GRID.ch, GRID.cw, GRID.ch);
      }
    }
    for (let c = 0; c <= GRID.cols; c++) {
      ctx.fillStyle = 'rgba(30,58,12,.10)';
      ctx.fillRect(GRID.x + c * GRID.cw - 1, GRID.y, 2, GRID.h);
    }
    for (let r = 0; r <= GRID.rows; r++) {
      ctx.fillStyle = 'rgba(30,58,12,.10)';
      ctx.fillRect(GRID.x, GRID.y + r * GRID.ch - 1, GRID.w, 2);
    }
    // 草叶质感
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#2f5a17';
    for (let i = 0; i < 160; i++) {
      const x = GRID.x + ((i * 97) % GRID.w);
      const y = GRID.y + ((i * 53) % GRID.h);
      ctx.fillRect(x, y, 2, 6);
    }
    ctx.restore();

    // 左侧地面（木板）
    const lg = ctx.createLinearGradient(0, 0, GRID.x, 0);
    lg.addColorStop(0, '#7d6141');
    lg.addColorStop(1, '#a5875e');
    ctx.fillStyle = lg;
    ctx.fillRect(0, GRID.y - 12, GRID.x, GRID.h + 12);
    ctx.strokeStyle = 'rgba(60,38,18,.25)';
    ctx.lineWidth = 2;
    for (let y = GRID.y - 12; y < GRID.y + GRID.h; y += 42) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GRID.x, y); ctx.stroke();
    }
    for (let x = 40; x < GRID.x; x += 78) {
      ctx.beginPath(); ctx.moveTo(x, GRID.y - 12); ctx.lineTo(x, GRID.y + GRID.h); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(GRID.x - 8, GRID.y, 8, GRID.h);

    // 左侧木栅栏
    ctx.fillStyle = '#8a6a44';
    ctx.fillRect(GRID.x - 10, GRID.y - 6, 10, GRID.h + 6);
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(GRID.x - 10, GRID.y - 6, 3, GRID.h + 6);
    ctx.fillStyle = 'rgba(40,24,8,.35)';
    for (let y = GRID.y + 14; y < GRID.y + GRID.h; y += 30) ctx.fillRect(GRID.x - 10, y, 10, 3);

    // 右侧出怪通道
    const rg = ctx.createLinearGradient(GRID.x + GRID.w, 0, W, 0);
    rg.addColorStop(0, '#9d8058');
    rg.addColorStop(1, '#6b5138');
    ctx.fillStyle = rg;
    ctx.fillRect(GRID.x + GRID.w, GRID.y - 12, W - GRID.x - GRID.w, GRID.h + 12);
    // 通道泥土颗粒
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#3a2a17';
    for (let i = 0; i < 90; i++) {
      const x = GRID.x + GRID.w + 6 + ((i * 71) % Math.max(1, W - GRID.x - GRID.w - 12));
      const y = GRID.y + ((i * 137) % GRID.h);
      ctx.fillRect(x, y, 3, 2);
    }
    ctx.restore();
    // 通道边的木栅栏
    ctx.strokeStyle = 'rgba(58,38,18,.55)';
    ctx.lineWidth = 3;
    for (let y = GRID.y - 4; y < GRID.y + GRID.h; y += 34) {
      ctx.beginPath(); ctx.moveTo(GRID.x + GRID.w + 4, y); ctx.lineTo(GRID.x + GRID.w + 4, y + 22); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.fillRect(GRID.x + GRID.w, GRID.y, 5, GRID.h);

    // 草坪整体阴影（贴地感）
    const sg = ctx.createLinearGradient(0, GRID.y + GRID.h - 26, 0, GRID.y + GRID.h);
    sg.addColorStop(0, 'rgba(20,40,8,0)');
    sg.addColorStop(1, 'rgba(20,40,8,.20)');
    ctx.fillStyle = sg;
    ctx.fillRect(GRID.x, GRID.y + GRID.h - 26, GRID.w, 26);

    // 顶部与底部泥土地
    ctx.fillStyle = '#6f553a';
    ctx.fillRect(0, GRID.y + GRID.h, W, H - GRID.y - GRID.h);
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    ctx.fillRect(0, GRID.y + GRID.h, W, 6);

    // 草地外框
    ctx.strokeStyle = 'rgba(45,70,20,.55)';
    ctx.lineWidth = 4;
    ctx.strokeRect(GRID.x, GRID.y, GRID.w, GRID.h);
  }

  function drawSunIcon(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    const grd = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.15, 0, 0, r);
    grd.addColorStop(0, '#fffbe0');
    grd.addColorStop(0.45, '#ffe45c');
    grd.addColorStop(1, '#f5a623');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,120,10,.55)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.3, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function woodPanel(x, y, w, h, r) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#a87740');
    g.addColorStop(0.45, '#8a5d2f');
    g.addColorStop(1, '#6a4521');
    ctx.fillStyle = g;
    roundRect(x, y, w, h, r || 14); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#4a2e14'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,160,.28)'; ctx.lineWidth = 2;
    roundRect(x + 5, y + 5, w - 10, h - 10, (r || 14) - 3); ctx.stroke();
  }

  function drawHUD() {
    ctx.textBaseline = 'middle';
    // 阳光面板
    woodPanel(20, 12, 216, 78, 16);
    drawSunIcon(58, 51, 22);
    const sunStr = String(S.sun);
    const sunSize = sunStr.length > 5 ? 26 : sunStr.length > 4 ? 30 : 38;
    ctx.font = '800 ' + sunSize + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#2c1c08';
    ctx.fillText(sunStr, 92, 54);
    ctx.fillStyle = 'rgba(255,240,190,.55)';
    ctx.fillText(sunStr, 90, 52);

    // 卡片
    const cx = 252, cy = 12, cw = 124, chh = 78;
    const cd = plantCost();
    const affordable = S.sun >= cd && S.cardCd <= 0;
    ctx.save();
    ctx.globalAlpha = affordable ? 1 : 0.62;
    ctx.fillStyle = '#f4e3b6';
    roundRect(cx, cy, cw, chh, 12); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = S.selected ? '#ffe14d' : '#6a4521'; ctx.stroke();
    // 猫图
    if (IMG.plant && IMG.plant.width) {
      const ih = 56, iw = IH(IMG.plant, ih);
      ctx.drawImage(IMG.plant, cx + 8, cy + 10, iw, ih);
    }
    // 费用
    drawSunIcon(cx + cw - 26, cy + chh - 16, 9);
    ctx.font = '700 17px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = affordable ? '#3a2410' : '#a33';
    ctx.fillText(String(cd), cx + cw - 44, cy + chh - 16);
    // 冷却
    if (S.cardCd > 0) {
      const p = S.cardCd / CFG.cardCd;
      ctx.fillStyle = 'rgba(20,20,20,.55)';
      ctx.fillRect(cx + 2, cy + 2, cw - 4, (chh - 4) * p);
    }
    ctx.restore();

    // 波次面板
    const px = 986, py = 12, pw = 274, ph = 78;
    woodPanel(px, py, pw, ph, 16);
    ctx.font = '700 20px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#ffeec2'; ctx.textAlign = 'left';
    const shownWave = S.phase === 'prep' ? S.wave + 1 : S.wave;
    ctx.fillText('第 ' + shownWave + ' 波', px + 18, py + 26);
    const remain = S.queue.length + S.zombies.length;
    ctx.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,238,194,.8)'; ctx.textAlign = 'right';
    ctx.fillText('剩余 ' + remain, px + pw - 18, py + 26);
    // 进度
    const barX = px + 18, barY = py + 44, barW = pw - 36, barH = 16;
    ctx.fillStyle = 'rgba(30,18,6,.55)';
    roundRect(barX, barY, barW, barH, 8); ctx.fill();
    const total = Math.max(1, S.waveTotal);
    const done = 1 - remain / total;
    ctx.fillStyle = '#7bbf4a';
    roundRect(barX + 2, barY + 2, Math.max(0, (barW - 4) * clamp(done, 0, 1)), barH - 4, 6); ctx.fill();
  }

  function IH(img, h) { return img.width * (h / img.height); }

  function drawPlant(p) {
    const c = cellCenter(p.col, p.row);
    const bob = Math.sin(p.bob * 2.4) * 2;
    const h = 96, w = IMG.plant ? IH(IMG.plant, h) : 60;
    // 阴影
    ctx.fillStyle = 'rgba(30,50,15,.22)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 36, w * 0.42, 12, 0, 0, Math.PI * 2); ctx.fill();
    if (IMG.plant && IMG.plant.width) {
      ctx.save();
      ctx.translate(c.x, c.y + 32 + bob);
      if (p.flash > 0) ctx.filter = 'brightness(1.7)';
      ctx.drawImage(IMG.plant, -w / 2, -h, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = '#c9b18a';
      roundRect(c.x - 26, c.y - 30, 52, 66, 12); ctx.fill();
    }
    // 血条
    if (p.hp < p.maxHp) {
      const bw = 58, bx = c.x - bw / 2, by = c.y + 32 - h - 12;
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      roundRect(bx, by, bw, 8, 4); ctx.fill();
      ctx.fillStyle = p.hp / p.maxHp > 0.4 ? '#7ed957' : '#ff6b5a';
      roundRect(bx + 1, by + 1, (bw - 2) * clamp(p.hp / p.maxHp, 0, 1), 6, 3); ctx.fill();
    }
  }

  function drawZombie(z) {
    const c = cellCenter(0, z.row);
    const h = 124, w = IMG.zombie ? IH(IMG.zombie, h) : 50;
    const walk = z.eating ? Math.sin(S.t * 10) * 1.5 : Math.sin(S.t * 5 + z.bob) * 2.5;
    ctx.fillStyle = 'rgba(30,20,10,.25)';
    ctx.beginPath(); ctx.ellipse(z.x, c.y + 40, w * 0.36, 12, 0, 0, Math.PI * 2); ctx.fill();
    if (IMG.zombie && IMG.zombie.width) {
      ctx.save();
      ctx.translate(z.x, c.y + 38 + walk * 0.4);
      ctx.rotate(z.eating ? Math.sin(S.t * 9) * 0.04 : Math.sin(S.t * 5 + z.bob) * 0.03);
      if (z.flash > 0) ctx.filter = 'brightness(1.8) saturate(.4)';
      else if (z.slowT > 0) ctx.filter = 'hue-rotate(160deg) saturate(1.3)';
      ctx.drawImage(IMG.zombie, -w / 2, -h, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = '#b9a';
      roundRect(z.x - 22, c.y - 60, 44, 96, 12); ctx.fill();
    }
    if (z.hp < z.maxHp) {
      const bw = 52, bx = z.x - bw / 2, by = c.y + 38 - h - 12;
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      roundRect(bx, by, bw, 8, 4); ctx.fill();
      ctx.fillStyle = '#ff8a5a';
      roundRect(bx + 1, by + 1, (bw - 2) * clamp(z.hp / z.maxHp, 0, 1), 6, 3); ctx.fill();
    }
  }

  function drawShot(sh) {
    ctx.save();
    ctx.translate(sh.x, sh.y);
    ctx.rotate(sh.rot);
    // 拖尾
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#fff2d6';
    ctx.beginPath(); ctx.ellipse(-16, 0, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // 猫耳：两只小三角 + 粉色耳心
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-11, 9);
      ctx.lineTo(0, -15 * s);
      ctx.lineTo(13, 6);
      ctx.closePath();
      ctx.fillStyle = '#fdf6ea';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#a97d55';
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-4, 4);
      ctx.lineTo(0, -7 * s);
      ctx.lineTo(6, 3);
      ctx.closePath();
      ctx.fillStyle = '#f6aec0';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSunObj(s) {
    const bob = Math.sin(S.t * 3 + s.bob) * 3;
    const r = 22 + Math.sin(S.t * 4 + s.bob) * 1.6;
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.life / 2);
    ctx.shadowColor = 'rgba(255,210,60,.85)';
    ctx.shadowBlur = 22;
    drawSunIcon(s.x, s.y + bob, r);
    ctx.restore();
  }

  function drawMower(m) {
    if (m.used && !m.rolling) return;
    const c = cellCenter(0, m.row);
    const h = 96, w = IMG.mower ? IH(IMG.mower, h) : 60;
    if (IMG.mower && IMG.mower.width) {
      ctx.save();
      ctx.translate(m.x, c.y + 34);
      if (m.rolling) ctx.rotate(m.rot);
      ctx.drawImage(IMG.mower, -w / 2, -h, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = '#e8c34a';
      ctx.beginPath(); ctx.arc(m.x, c.y, 26, 0, Math.PI * 2); ctx.fill();
    }
    if (m.rolling) {
      ctx.fillStyle = 'rgba(180,160,120,.35)';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(m.x - 40 - i * 18, c.y + 30 + Math.sin(S.t * 12 + i) * 3, 6 - i, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // 天空/背景
    const sky = ctx.createLinearGradient(0, 0, 0, GRID.y);
    sky.addColorStop(0, '#b3ddef');
    sky.addColorStop(0.65, '#dcefd6');
    sky.addColorStop(1, '#eaf4d2');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GRID.y);

    // 日光
    const glow = ctx.createRadialGradient(1110, 18, 8, 1110, 18, 280);
    glow.addColorStop(0, 'rgba(255,248,205,.9)');
    glow.addColorStop(1, 'rgba(255,248,205,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(820, 0, 460, 240);

    // 云
    cloud(210, 30, 1);
    cloud(690, 16, 0.78);
    cloud(960, 54, 0.55);

    // 远山两层
    ctx.fillStyle = '#bcd9a4';
    ctx.beginPath();
    ctx.moveTo(0, GRID.y);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, GRID.y - 46 - Math.sin(x * 0.0042) * 20 - Math.cos(x * 0.011) * 9);
    }
    ctx.lineTo(W, GRID.y); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#9ec87e';
    ctx.beginPath();
    ctx.moveTo(0, GRID.y);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, GRID.y - 20 - Math.sin(x * 0.0075 + 1.7) * 16 - Math.cos(x * 0.016) * 6);
    }
    ctx.lineTo(W, GRID.y); ctx.closePath(); ctx.fill();

    // 顶部树篱
    ctx.fillStyle = '#4b832b';
    ctx.beginPath();
    for (let x = -30; x < W + 30; x += 40) {
      const r = 24 + Math.sin(x * 0.09) * 3;
      ctx.moveTo(x + r, GRID.y - 6);
      ctx.arc(x, GRID.y - 6, r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    for (let x = -30; x < W + 30; x += 40) {
      const r = 17 + Math.sin(x * 0.09) * 2;
      ctx.moveTo(x + r, GRID.y - 14);
      ctx.arc(x - 2, GRID.y - 14, r, 0, Math.PI * 2);
    }
    ctx.fill();

    drawLawn();

    if (!S) return;

    // 半透明格子（放置预览）
    if (S.selected && S.hover) {
      const c = cellCenter(S.hover.col, S.hover.row);
      const occupied = S.plants.some(p => p.col === S.hover.col && p.row === S.hover.row);
      ctx.fillStyle = occupied ? 'rgba(255,80,80,.22)' : 'rgba(255,255,255,.28)';
      ctx.fillRect(GRID.x + S.hover.col * GRID.cw, GRID.y + S.hover.row * GRID.ch, GRID.cw, GRID.ch);
    }

    S.mowers.forEach(drawMower);
    S.plants.forEach(drawPlant);
    S.zombies.slice().sort((a, b) => a.row - b.row).forEach(drawZombie);
    S.shots.forEach(drawShot);
    S.suns.forEach(drawSunObj);

    // 粒子
    for (const p of S.parts) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    // 飘字
    for (const t of S.texts) {
      ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
      ctx.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(50,30,10,.6)';
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    drawHUD();

    // 波次横幅
    if (S.banner) {
      const a = clamp(S.banner.life / 0.45, 0, 1) * clamp((S.banner.max - S.banner.life) / 0.3, 0, 1);
      ctx.globalAlpha = a;
      ctx.textBaseline = 'alphabetic';
      ctx.font = '900 52px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(60,30,10,.8)';
      ctx.strokeText(S.banner.text, W / 2, 196);
      ctx.fillStyle = '#ffe14d';
      ctx.fillText(S.banner.text, W / 2, 196);
      ctx.globalAlpha = 1;
    }

    // 操作提示
    if (S.tipT > 0 && S.phase !== 'over') {
      ctx.globalAlpha = clamp(S.tipT / 2, 0, 1) * 0.9;
      ctx.font = '600 18px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(20,30,10,.55)';
      roundRect(W / 2 - 250, H - 46, 500, 34, 17); ctx.fill();
      ctx.fillStyle = '#fff8e0';
      ctx.fillText('点击阳光收集 · 点卡片再点草地种猫猫', W / 2, H - 23);
      ctx.globalAlpha = 1;
    }

    // 准备倒计时
    if (S.phase === 'prep' && S.prepT > 0) {
      ctx.font = '700 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText('下一波 ' + Math.ceil(S.prepT) + ' 秒', W / 2, 150);
    }

    if (S.buffOpen) drawBuffPanel();
    else if (S.over) drawOverPanel();
  }

  // ---------- 输入 ----------
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    const y = (e.clientY - r.top) * (H / r.height);
    return { x, y };
  }

  function tryPlace(col, row) {
    if (!S || S.phase === 'over' || S.phase === 'buff') return;
    if (S.plants.some(p => p.col === col && p.row === row)) return;
    const cost = plantCost();
    if (S.cardCd > 0) return;
    if (S.sun < cost) {
      S.texts.push({ x: cellCenter(col, row).x, y: cellCenter(col, row).y, text: '阳光不足', life: 0.9, max: 0.9, color: '#ff9b8a' });
      return;
    }
    S.sun -= cost;
    S.cardCd = CFG.cardCd;
    const c = cellCenter(col, row);
    const hp = Math.round(CFG.plantHp * S.mods.hp);
    S.plants.push({ col, row, x: c.x, y: c.y, hp, maxHp: hp, cd: 0.3, bob: rand(0, 6.28), flash: 0 });
    burst(c.x, c.y + 10, '#d9f0a3', 10, 130);
    SFX.plant();
  }

  canvas.addEventListener('pointerdown', e => {
    ensureAudio();
    if (!S) return;
    const { x, y } = toWorld(e);

    // 结算面板
    if (S.over) {
      if (hitRect(againRect, x, y)) newRun();
      return;
    }
    // 三选一面板
    if (S.buffOpen) {
      for (let i = 0; i < buffRects.length; i++) {
        if (hitRect(buffRects[i], x, y)) {
          const b = S.buffOptions[i];
          if (b) chooseBuff(b);
          return;
        }
      }
      return;
    }

    // 先收阳光
    for (let i = S.suns.length - 1; i >= 0; i--) {
      const s = S.suns[i];
      if (Math.hypot(x - s.x, y - s.y) < 42) {
        collectSun(s);
        S.suns.splice(i, 1);
        return;
      }
    }
    // 卡片
    if (x >= 252 && x <= 376 && y >= 12 && y <= 90) {
      S.selected = !S.selected;
      S.hover = null;
      return;
    }
    const cell = cellAt(x, y);
    if (cell && S.selected) {
      tryPlace(cell.col, cell.row);
      return;
    }
    S.selected = false;
  });

  canvas.addEventListener('pointermove', e => {
    if (!S) return;
    const { x, y } = toWorld(e);
    const cell = cellAt(x, y);
    S.hover = cell;
  });

  canvas.addEventListener('pointerleave', () => { if (S) S.hover = null; });

  window.addEventListener('keydown', e => {
    if (!S) return;
    if (e.key === '1') S.selected = !S.selected;
    if (e.key === 'Escape') S.selected = false;
  });

  // ---------- 自适应 ----------
  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // ---------- 主循环 ----------
  let last = 0;
  function loop(ts) {
    if (!last) last = ts;
    let dt = (ts - last) / 1000;
    last = ts;
    dt = Math.min(dt, 0.05);
    if (assetsReady && S) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function showTip(show) {
    const el = document.getElementById('tip');
    if (el) el.style.display = show ? 'block' : 'none';
  }

  newRun();
  resize();
  window.__PVZ_STATE = () => S;
  loadAssets(() => {});
  requestAnimationFrame(loop);
})();

</script>
</body>
